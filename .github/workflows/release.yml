name: release

# Publishes to PyPI when you push a version tag (v0.2.0, v0.2.1, ...).
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere.
# One-time setup on PyPI -> your project -> Publishing -> Add a new publisher:
#   Owner:            <your-github-username>
#   Repository:       physfdt
#   Workflow name:    release.yml
#   Environment name: pypi
# For the very first upload the project does not exist yet, so add a *pending*
# publisher from https://pypi.org/manage/account/publishing/ instead.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        run: |
          python -m pip install -U pip
          pip install -e .
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import physfdt; print(physfdt.__version__)")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != version $PKG"; exit 1; }

      - name: Tests must pass before anything is published
        run: |
          pip install pytest
          pytest -q

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
